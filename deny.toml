[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "Unlicense",
  # webpki-roots 1.x (Mozilla's root certificates, pulled in by ureq): a permissive data licence.
  "CDLA-Permissive-2.0",
]

[advisories]
version = 2
# serde_yaml_ng parses note frontmatter through unsafe-libyaml, which is
# unmaintained. Replacing the YAML parser is an open question; until it is
# decided, this one advisory is
# accepted and every other advisory still fails the check.
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml_ng; parser replacement is an open question" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
