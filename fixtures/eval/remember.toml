# The remember suite's synthetic history and answer key
# (docs/designs/remember.md, "Eval"). Everything here is invented.
#
# Five planted rules: one said in other words 48 days apart (pnpm), one
# taken back weeks later (ask-migrations, reversed by run-migrations), one
# found only in an account memory and then said once (no-dist), and one
# said twice in two days (backup-drill). Noise: a correction an agent
# relays, and a replayed transcript. Sessions with `needs` are where a
# rule should be given: a long session that changes topic (n3) and a
# session outside the workspace (o1) among them.

[[rules]]
id = "pnpm"
rule = "Use pnpm in every repository; never run npm."
scope = "machine"
quotes = [
  "no, this repo uses pnpm, not npm",
  "stop running npm install, use pnpm",
]

[[rules]]
id = "ask-migrations"
rule = "Ask the person before running a database migration."
scope = "workspace"
quotes = [
  "never run the migration before asking me",
  "dont run the migration before asking me",
]

[[rules]]
id = "run-migrations"
rule = "Run database migrations yourself; do not ask first."
scope = "workspace"
reverses = "ask-migrations"
quotes = [
  "why do you keep asking about the migration, just run it",
  "why are you asking about the migration again, just run it",
]

[[rules]]
id = "no-dist"
rule = "Never commit generated files under dist/."
scope = "machine"
quotes = [
  "Never commit generated files under dist/.",
  "dont commit the dist folder, it is generated",
]

[[rules]]
id = "backup-drill"
rule = "Run the restore drill before you change backup retention."
scope = "workspace"
quotes = [
  "no, run the restore drill before you change backup retention",
  "no, do the restore drill first before changing the backup retention",
]

[[memory]]
path = ".claude-work/CLAUDE.md"
source = "claude-code:work/CLAUDE.md"
text = """
# How I work

- Never commit generated files under dist/.
- ok
"""

