[package]
name = "hippo-app"
description = "Hippo.app: a macOS window over hippo's files"
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/VanitasCaesar1/hippo"
homepage = "https://github.com/VanitasCaesar1/hippo"
publish = false

[dependencies]
# One Zed commit (v1.27.0). Moving it is its own pull request.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", default-features = false, features = ["font-kit", "runtime_shaders"] }
futures = "0.3.34"
hippo-core = { path = "../../crates/hippo-core" }
hippo-view = { path = "../../crates/hippo-view" }
# The menu-bar item: GPUI has no status item, so the
# app makes one with the same objc2 crates GPUI's macOS platform links.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSApplication", "NSCell"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSObject", "NSError", "NSArray"] }
# T3 Code's state, opened read-only to find a session's thread.
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["std", "formatting", "parsing", "macros", "local-offset"] }
ulid = "3.0.0"
unicode-segmentation = "1.13.3"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", default-features = false, features = ["font-kit", "test-support"] }
tempfile = "3.27.0"
