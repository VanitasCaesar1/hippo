name: release

# On a pushed v* tag: the four release binaries, built by the same
# scripts/release.sh as a local release, attached to the tag's release with
# their checksums and the filled Homebrew formula.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        env:
          HIPPO_DIST_DIR: ${{ runner.temp }}/dist
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: ${{ runner.temp }}/dist/hippo-*

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo install --locked cargo-zigbuild --version 0.24.1
      - name: Build
        env:
          HIPPO_DIST_DIR: ${{ runner.temp }}/dist
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: ${{ runner.temp }}/dist/hippo-*

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Fill the formula
        env:
          HIPPO_DIST_DIR: ${{ runner.temp }}/dist
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" --no-build
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ runner.temp }}/dist
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DIST"/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DIST"/* --verify-tag \
              --title "hippo ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md for what this release holds."
          fi
