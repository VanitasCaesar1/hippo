protocol = "HIPPO_V1"
pass = "limits-and-quotas"
about = "A rate limit hit with its quoted error is appended, and a note the filter leaves out is not read"

[[session]]
id = "geocode-429-1"
notes = ["notes/Limits.md", "notes/Lichen guide.md"]
handoff = "Hit the geocoding rate limit; see [[Limits]]."

[model]
reply = '''[{"note": "notes/Limits.md", "kind": "append", "old": "", "new": "\n## Hit in sessions\n- 2026-11-01: Geocoding service: 50 requests per minute. Error: `429 Too Many Requests: rate limit of 50 requests per minute exceeded`. The session added a 1.3 second pause between calls and the batch finished. (geocode-429-1, turns 2 and 3)\n", "evidence": [{"session": "geocode-429-1", "ordinal": 2}, {"session": "geocode-429-1", "ordinal": 3}], "reason": "Turn 2 shows the error and turn 3 the limit and what was done."}]'''
verdict = "confirm"

[expect]
calls = 1
proposals = 1
validation_failures = 0
confirmed = 1
rejected = 0
applied = 1
prompt_contains = ["Limits"]
prompt_excludes = ["Reindeer lichen"]

[[expect.note]]
path = "notes/Limits.md"
contains = ["50 requests per minute"]
excludes = []
