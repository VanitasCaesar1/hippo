protocol = "HIPPO_V1"
pass = "migration-log"
about = "A matching entry is appended, and a note the filter leaves out is not read"

[[session]]
id = "migrate-1"
notes = ["notes/Migrations.md", "notes/Garden plan.md"]
handoff = "Ran the orders index migration on staging; see [[Migrations]]."

[model]
reply = '''[{"note": "notes/Migrations.md", "kind": "append", "old": "", "new": "\n- 2026-11-01: 0042_add_orders_index on staging, run with `make migrate ENV=staging`. Outcome: applied. (migrate-1, turns 1 and 3)\n", "evidence": [{"session": "migrate-1", "ordinal": 1}, {"session": "migrate-1", "ordinal": 3}], "reason": "Turn 1 shows the command that ran on staging and turn 3 reports it applied."}]'''
verdict = "confirm"

[expect]
calls = 1
proposals = 1
validation_failures = 0
confirmed = 1
rejected = 0
applied = 1
prompt_contains = ["Migrations"]
prompt_excludes = ["orchard committee"]

[[expect.note]]
path = "notes/Migrations.md"
contains = ["0042_add_orders_index"]
excludes = []
