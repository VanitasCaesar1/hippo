protocol = "HIPPOCAMP_V1"
pass = "deploy-log"
about = "A matching entry is appended, and a note the filter leaves out is not read"

[[session]]
id = "deploy-1"
notes = ["notes/Deploy log.md", "notes/Book club.md"]
handoff = "Deployed the api service to staging; see [[Deploy log]]."

[model]
reply = '''[{"note": "notes/Deploy log.md", "kind": "append", "old": "", "new": "\n- 2026-11-01: sample-api build 118 to staging, run with `make deploy TARGET=staging`. Outcome: succeeded, health check passed. (deploy-1, turns 1 and 3)\n", "evidence": [{"session": "deploy-1", "ordinal": 1}, {"session": "deploy-1", "ordinal": 3}], "reason": "Turn 1 shows the deploy command and turn 3 reports build 118 live on staging with a passing health check."}]'''
verdict = "confirm"

[expect]
calls = 1
proposals = 1
validation_failures = 0
confirmed = 1
rejected = 0
applied = 1
prompt_contains = ["Deploy log"]
prompt_excludes = ["river book club"]

[[expect.note]]
path = "notes/Deploy log.md"
contains = ["build 118"]
excludes = []
