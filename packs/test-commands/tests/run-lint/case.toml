protocol = "HIPPOCAMP_V1"
pass = "test-commands"
about = "A matching entry is appended, and a note the filter leaves out is not read"

[[session]]
id = "testing-1"
notes = ["notes/Testing.md", "notes/Fete planning.md"]
handoff = "Found the lint command that passes for the sample app; see [[Testing]]."

[model]
reply = '''[{"note": "notes/Testing.md", "kind": "append", "old": "", "new": "\n- 2026-11-01: `make check` runs the linter over the whole sample app and passed with no problems. (testing-1, turns 1 and 3)\n", "evidence": [{"session": "testing-1", "ordinal": 1}, {"session": "testing-1", "ordinal": 3}], "reason": "Turn 1 shows the command and turn 3 reports that it passed."}]'''
verdict = "confirm"

[expect]
calls = 1
proposals = 1
validation_failures = 0
confirmed = 1
rejected = 0
applied = 1
prompt_contains = ["Testing"]
prompt_excludes = ["harvest fete"]

[[expect.note]]
path = "notes/Testing.md"
contains = ["`make check`"]
excludes = []
