protocol = "HIPPOCAMP_V1"
pass = "incident-timeline"
about = "A moment of the incident is appended to the timeline, and a note the filter leaves out is not read"

[[session]]
id = "queue-stall"
notes = ["notes/Incident timeline.md", "notes/Meeting notes.md"]
handoff = "Found why the queue stalled; see [[Incident timeline]]."

[model]
reply = '''[{"note": "notes/Incident timeline.md", "kind": "append", "old": "", "new": "\n- 2026-11-01 10:00: The queue was reported stalled. At 10:00 the session found the worker crashing at startup because the config file had a duplicate key, and fixed it by removing the duplicate; the worker took jobs again. (queue-stall, turn 1)\n", "evidence": [{"session": "queue-stall", "ordinal": 1}], "reason": "Turn 1 shows the finding and the fix."}]'''
verdict = "confirm"

[expect]
calls = 1
proposals = 1
validation_failures = 0
confirmed = 1
rejected = 0
applied = 1
prompt_contains = ["Incident timeline"]
prompt_excludes = ["lantern festival"]

[[expect.note]]
path = "notes/Incident timeline.md"
contains = ["duplicate key"]
excludes = []
